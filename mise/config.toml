[tools]
node = "24.22.3"
ruby = "3.4.13"
"github:Dicklesworthstone/destructive_command_guard" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["node", "ruby"]
# Keep Node selection tied to version files such as .node-version and .nvmrc.
idiomatic_version_file_disable_files = ["node:package.json"]
